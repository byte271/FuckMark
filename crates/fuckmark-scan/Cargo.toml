[package]
name = "fuckmark-scan"
version = "0.4.1"
edition = "2021"
license = "MIT"
publish = false
description = "fuckmark-hidden-scan-v1 classifier for native and wasm32"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
