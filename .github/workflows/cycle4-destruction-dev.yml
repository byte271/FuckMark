name: Cycle4 Destruction Dev Run

on:
  pull_request:
    paths:
      - ".github/workflows/cycle4-destruction-dev.yml"
      - "requirements-smoke.txt"
      - "fuckmark/experiments/exact_survival_greedy.py"
      - "fuckmark/experiments/exact_survival_greedy_v2.py"
      - "fuckmark/sanitizer_robustness.py"
      - "fuckmark/tiny_dev_destruction_dev_hf.py"
      - "fuckmark/transforms/**"
      - "tests/test_exact_survival_greedy_v2.py"
      - "tests/test_general_word_leading_spacing_rule.py"
      - "tests/test_sanitizer_robustness.py"
      - "tests/test_content_region_destruction_profile.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: cycle4-destruction-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  destruction-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install exact CPU Torch runtime
        run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned Transformers SynthID dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run paired destruction dev comparison with diagnostic U+200C arm
        run: >-
          python -m fuckmark.tiny_dev_destruction_dev_hf
          --sources 8
          --budget 16
          --seed-base 660000
          --json artifacts/cycle4-destruction-dev.json
      - name: Assert visible-only arms introduce zero invisible codepoints and record summaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/cycle4-destruction-dev.json").read_text(encoding="utf-8"))
          rows = payload["rows"]
          for prefix in ("A_cycle3_proxy", "B_cycle3_exact_v1", "C_destruction_exact_v2"):
              invisible = sum(row.get(f"{prefix}_invisible", 0) for row in rows)
              if invisible:
                  raise SystemExit(f"visible-only arm {prefix} introduced {invisible} invisible codepoints")
          summary = payload["summaries"]
          for prefix in ("A_cycle3_proxy", "B_cycle3_exact_v1", "C_destruction_exact_v2"):
              print(f"{prefix}: detected={summary[prefix]['detected']}/{len(rows)} drop={summary[prefix]['mean_drop_vs_pristine']}")
          diagnostic = summary["D_u200c_exact_v2_diagnostic"]
          print(f"diagnostic_u200c (upper bound only): detected={diagnostic['detected']}/{len(rows)} invisible_mean={diagnostic['mean_invisible_introduced']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cycle4-destruction-dev
          path: artifacts/cycle4-destruction-dev.json
          if-no-files-found: error
