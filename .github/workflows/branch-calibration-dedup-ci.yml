name: Branch calibration dedup validation

on:
  push:
    branches: [fix/middev-calibration-dedup]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    name: Python 3.12 debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate lock and full test suite
        id: validate
        shell: bash
        run: |
          set +e
          (
            python -m pip install --upgrade pip &&
            python -m pip install "uv==0.10.0" &&
            python -m pip install -e ".[dev]" &&
            uv lock --check --python "3.12" &&
            python -m pytest -q
          ) > validation.log 2>&1
          rc=$?
          cat validation.log
          failure="$(grep -E '^FAILED ' validation.log | head -1 | awk '{print $2}')"
          if [ -z "$failure" ]; then
            failure="$(grep -E '^ERROR ' validation.log | head -1 | awk '{print $2}')"
          fi
          if [ -z "$failure" ]; then
            failure="setup-or-lock"
          fi
          failure="$(printf '%s' "$failure" | tr ' :' '__' | cut -c1-90)"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "failure=$failure" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish readable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RC: ${{ steps.validate.outputs.rc }}
          FAILURE: ${{ steps.validate.outputs.failure }}
        run: |
          if [ "$VALIDATION_RC" = "0" ]; then
            STATE=success
            CONTEXT="dedup-debug/passed"
          else
            STATE=failure
            CONTEXT="dedup-debug/$FAILURE"
          fi
          export STATE CONTEXT
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": os.environ["CONTEXT"],
              "description": "3.12 full pytest + uv lock debug result",
          }))
          PY
          )"
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Fail job when validation failed
        if: steps.validate.outputs.rc != '0'
        run: exit 1
