name: Branch calibration dedup validation

on:
  push:
    branches: [fix/middev-calibration-dedup]
    paths-ignore:
      - '.ci-results/**'

permissions:
  contents: write

jobs:
  test:
    name: Python 3.12 debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate lock and full test suite
        id: validate
        shell: bash
        run: |
          set +e
          (
            python -m pip install --upgrade pip &&
            python -m pip install "uv==0.10.0" &&
            python -m pip install -e ".[dev]" &&
            uv lock --check --python "3.12" &&
            python -m pytest -q
          ) > validation.log 2>&1
          rc=$?
          cat validation.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist debug log on branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RC: ${{ steps.validate.outputs.rc }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GH_TOKEN']
          path = '.ci-results/dedup-3.12.txt'
          raw = open('validation.log', 'rb').read()
          header = (
              f"commit={os.environ['GITHUB_SHA']}\n"
              f"rc={os.environ.get('VALIDATION_RC', '')}\n"
              "--- validation.log ---\n"
          ).encode()
          content = base64.b64encode(header + raw).decode()
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          sha = None
          try:
              req = urllib.request.Request(api + '?ref=' + branch, headers=headers)
              with urllib.request.urlopen(req) as response:
                  sha = json.load(response).get('sha')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          payload = {
              'message': 'Record calibration dedup CI debug result',
              'content': content,
              'branch': branch,
          }
          if sha:
              payload['sha'] = sha
          req = urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers=headers | {'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(req) as response:
              json.load(response)
          PY

      - name: Fail job when validation failed
        if: steps.validate.outputs.rc != '0'
        run: exit 1
