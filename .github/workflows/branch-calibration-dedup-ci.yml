name: Branch calibration dedup validation

on:
  push:
    branches: [fix/middev-calibration-dedup]
    paths-ignore:
      - '.ci-results/**'

permissions:
  contents: write

env:
  VALIDATION_NONCE: "4"

jobs:
  test:
    name: Python 3.11 and 3.13 final
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate Python 3.11
        id: py311
        shell: bash
        run: |
          set +e
          (
            python -m pip install --upgrade pip &&
            python -m pip install "uv==0.10.0" &&
            python -m pip install -e ".[dev]" &&
            uv lock --check --python "3.11" &&
            python -m pytest -q
          ) > validation-3.11.log 2>&1
          rc=$?
          cat validation-3.11.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate Python 3.13
        id: py313
        shell: bash
        run: |
          set +e
          (
            python -m pip install --upgrade pip &&
            python -m pip install "uv==0.10.0" &&
            python -m pip install -e ".[dev]" &&
            uv lock --check --python "3.13" &&
            python -m pytest -q
          ) > validation-3.13.log 2>&1
          rc=$?
          cat validation-3.13.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist final logs on branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC311: ${{ steps.py311.outputs.rc }}
          RC313: ${{ steps.py313.outputs.rc }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          token = os.environ['GH_TOKEN']
          path = '.ci-results/dedup-final.txt'
          body = (
              f"commit={os.environ['GITHUB_SHA']}\n"
              f"rc311={os.environ.get('RC311', '')}\n"
              f"rc313={os.environ.get('RC313', '')}\n"
              "--- validation-3.11.log ---\n"
          ).encode()
          body += open('validation-3.11.log', 'rb').read()
          body += b"\n--- validation-3.13.log ---\n"
          body += open('validation-3.13.log', 'rb').read()
          content = base64.b64encode(body).decode()
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          sha = None
          try:
              req = urllib.request.Request(api + '?ref=' + branch, headers=headers)
              with urllib.request.urlopen(req) as response:
                  sha = json.load(response).get('sha')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          payload = {
              'message': 'Record final calibration dedup CI result',
              'content': content,
              'branch': branch,
          }
          if sha:
              payload['sha'] = sha
          req = urllib.request.Request(
              api,
              data=json.dumps(payload).encode(),
              headers=headers | {'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(req) as response:
              json.load(response)
          PY

      - name: Fail job when validation failed
        if: steps.py311.outputs.rc != '0' || steps.py313.outputs.rc != '0'
        run: exit 1
