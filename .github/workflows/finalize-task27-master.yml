name: Task 27 master convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-task27-master.yml
      - .github/scripts/apply_task27_hardening.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply converged hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_task27_hardening.py')
          text = path.read_text()
          text = text.replace('    patch_calibration_interval_if_needed()\n', '')
          path.write_text(text)
          PY
          python .github/scripts/apply_task27_hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path('fuckmark/experiments/schedule_analysis.py')
          text = path.read_text()
          function_start = text.index('def run_e10_spacing_comparison(')
          definition_anchor = '    definition = default_development_experiment_registry().get(DevelopmentExperimentId.E10)\n'
          definition_index = text.index(definition_anchor, function_start)
          status_block = (
              '    if missing:\n'
              '        status = E10Status.INCOMPLETE\n'
              '    elif unmatched_count:\n'
              '        status = E10Status.WITHHELD_UNMATCHED_COST\n'
              '    else:\n'
              '        status = E10Status.COMPLETE_MATCHED\n'
          )
          if status_block not in text[function_start:definition_index]:
              text = text[:definition_index] + status_block + text[definition_index:]

          class_start = text.index('class E10SpacingComparisonResult:')
          class_payload_start = text.index('    def _payload(self) -> dict[str, object]:', class_start)
          function_start = text.index('def run_e10_spacing_comparison(', class_payload_start)
          canonical_class_payload = '''    def _payload(self) -> dict[str, object]:
              return {
                  "algorithm_version": self.algorithm_version,
                  "experiment_definition_hash": self.experiment_definition_hash,
                  "tiny_dev_artifact_hash": self.tiny_dev_artifact_hash,
                  "detector_identity_hash": self.detector_identity_hash,
                  "threshold_hash": self.threshold_hash,
                  "pair_hashes": self.pair_hashes,
                  "expected_source_count": self.expected_source_count,
                  "observed_source_count": self.observed_source_count,
                  "missing_source_ids": self.missing_source_ids,
                  "matched_pair_count": self.matched_pair_count,
                  "unmatched_cost_pair_count": self.unmatched_cost_pair_count,
                  "mean_coverage_difference_even_minus_clustered": self.mean_coverage_difference_even_minus_clustered,
                  "mean_observation_ratio_difference_even_minus_clustered": self.mean_observation_ratio_difference_even_minus_clustered,
                  "mean_margin_drop_difference_even_minus_clustered": self.mean_margin_drop_difference_even_minus_clustered,
                  "comparison_withheld_for_unmatched_cost": self.comparison_withheld_for_unmatched_cost,
                  "status": self.status.value,
              }


          '''
          text = text[:class_payload_start] + canonical_class_payload + text[function_start:]

          function_start = text.index('def run_e10_spacing_comparison(')
          pair_hashes_index = text.index('    pair_hashes = tuple(sorted(value.pair_hash for value in pair_tuple))\n', function_start)
          run_payload_start = text.index('    payload = {\n', pair_hashes_index)
          return_start = text.index('    return E10SpacingComparisonResult(', run_payload_start)
          canonical_run_payload = '''    payload = {
              "algorithm_version": E10_ALGORITHM_VERSION,
              "experiment_definition_hash": definition.definition_hash,
              "tiny_dev_artifact_hash": artifact.artifact_hash,
              "detector_identity_hash": detector_identity_hash,
              "threshold_hash": threshold_hash,
              "pair_hashes": pair_hashes,
              "expected_source_count": len(expected_ids),
              "observed_source_count": len(observed_source_ids),
              "missing_source_ids": missing,
              "matched_pair_count": len(matched),
              "unmatched_cost_pair_count": unmatched_count,
              "mean_coverage_difference_even_minus_clustered": _mean(coverage_values),
              "mean_observation_ratio_difference_even_minus_clustered": _mean(observation_values),
              "mean_margin_drop_difference_even_minus_clustered": _mean(margin_values),
              "comparison_withheld_for_unmatched_cost": unmatched_count > 0,
              "status": status.value,
          }
          '''
          text = text[:run_payload_start] + canonical_run_payload + text[return_start:]

          function_start = text.index('def run_e10_spacing_comparison(')
          return_start = text.index('    return E10SpacingComparisonResult(', function_start)
          next_section = text.index('\n\n\n@dataclass', return_start)
          canonical_constructor = '''    return E10SpacingComparisonResult(
              algorithm_version=E10_ALGORITHM_VERSION,
              experiment_definition_hash=definition.definition_hash,
              tiny_dev_artifact_hash=artifact.artifact_hash,
              detector_identity_hash=detector_identity_hash,
              threshold_hash=threshold_hash,
              pair_hashes=pair_hashes,
              expected_source_count=len(expected_ids),
              observed_source_count=len(observed_source_ids),
              missing_source_ids=missing,
              matched_pair_count=len(matched),
              unmatched_cost_pair_count=unmatched_count,
              mean_coverage_difference_even_minus_clustered=payload["mean_coverage_difference_even_minus_clustered"],
              mean_observation_ratio_difference_even_minus_clustered=payload["mean_observation_ratio_difference_even_minus_clustered"],
              mean_margin_drop_difference_even_minus_clustered=payload["mean_margin_drop_difference_even_minus_clustered"],
              comparison_withheld_for_unmatched_cost=unmatched_count > 0,
              status=status,
              result_hash=sha256_json(payload),
          )'''
          text = text[:return_start] + canonical_constructor + text[next_section:]
          path.write_text(text)
          PY
      - name: Full suite
        run: python -m pytest -q

  commit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Rebase latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply converged hardening
        shell: bash
