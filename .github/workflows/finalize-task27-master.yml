name: Task 27 master convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-task27-master.yml
      - .github/scripts/apply_task27_hardening.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply converged hardening
        run: python .github/scripts/apply_task27_hardening.py
      - name: Full suite
        run: python -m pytest -q

  commit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Rebase latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply converged hardening
        run: python .github/scripts/apply_task27_hardening.py
      - name: Full latest-main suite
        run: python -m pytest -q
      - name: Commit convergence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/patch-schedule-identity.yml \
            .github/workflows/patch-experiment-key-blind.yml \
            .github/workflows/patch-calibration-interval.yml \
            .github/workflows/finalize-task27-hardening.yml \
            .github/workflows/finalize-transform-provenance.yml \
            .github/workflows/finalize-task27-master.yml \
            .github/scripts/apply_task27_hardening.py
          git add \
            fuckmark/experiments/schedule_analysis.py \
            fuckmark/experiments/transform_analysis.py \
            fuckmark/experiments/e02_pristine.py \
            fuckmark/experiments/transform_provenance.py \
            fuckmark/experiments/__init__.py \
            fuckmark/detectors/calibration_threshold.py \
            fuckmark/observations.py \
            tests/test_experiment_key_blind_boundary.py \
            tests/test_calibration_interval_integrity.py \
            tests/test_token_ngram_geometry_integrity.py \
            tests/test_e02_interval_integrity.py \
            tests/test_transform_provenance.py \
            tests/test_e09_random_baseline.py \
            tests/test_e10_spacing_comparison.py
          git commit -m "Converge Task 27 execution integrity"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              git push origin --delete __probe_invalid__ || true
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
