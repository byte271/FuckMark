name: Public Repetition Conformance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repetition-conformance.yml"
      - "fuckmark/geometry/repetition.py"
      - "fuckmark/geometry/__init__.py"
      - "tests/test_repetition_geometry.py"
      - "tests/test_repetition_external_conformance.py"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout FuckMark head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout DeepMind reference
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/synthid-text
          ref: addb4a158143c7c6851a1308f78b89fceed59683
          path: .reference/synthid-text
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install exact CPU Torch runtime
        run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install maintained Transformers SynthID dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Compare public repetition masks
        env:
          FUCKMARK_EXTERNAL_REPETITION_CONFORMANCE: "1"
          PYTHONPATH: ${{ github.workspace }}/.reference/synthid-text/src
        run: python -m pytest -q tests/test_repetition_external_conformance.py
