name: SynthID High Repetition Detector Pilot

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face causal language model
        required: true
        default: openai-community/gpt2
        type: string
      prompt_limit:
        description: Number of built-in prompts used before Q4 selection
        required: true
        default: "24"
        type: string
      max_new_tokens:
        description: Generated completion tokens per sample
        required: true
        default: "192"
        type: string
      registry:
        description: Transform registry used by the frozen key-blind geometry policy
        required: true
        default: mechanism
        type: choice
        options:
          - release
          - development
          - mechanism
      budgets:
        description: Comma-separated operation budgets
        required: true
        default: "1,2,4"
        type: string

permissions:
  contents: read

jobs:
  high-repetition-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install CPU Torch
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install SynthID experiment dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run frozen high-repetition detector pilot
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_PROMPT_LIMIT: ${{ inputs.prompt_limit }}
          INPUT_MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_BUDGETS: ${{ inputs.budgets }}
        run: >-
          python -m fuckmark.synthid_high_repetition_detector_hf
          --model "$INPUT_MODEL"
          --device cpu
          --prompt-limit "$INPUT_PROMPT_LIMIT"
          --max-new-tokens "$INPUT_MAX_NEW_TOKENS"
          --registry "$INPUT_REGISTRY"
          --budgets "$INPUT_BUDGETS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-high-repetition-detector-${{ inputs.registry }}
          path: artifacts/
          if-no-files-found: warn
