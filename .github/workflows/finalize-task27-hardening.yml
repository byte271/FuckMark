name: Task 27 hardening convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-task27-hardening.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply converged hardening
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import sys
          from dataclasses import fields, replace
          from pathlib import Path

          def patch_schedule() -> None:
              path = Path('fuckmark/experiments/schedule_analysis.py')
              text = path.read_text()
              if 'from ..hashing import sha256_json, sha256_text' not in text:
                  old = 'from ..hashing import sha256_json\n'
                  assert old in text
                  text = text.replace(old, 'from ..hashing import sha256_json, sha256_text\n', 1)
              if 'schedule row source text hash does not match corpus source' not in text:
                  old = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
                  new = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.source_text_hash != sha256_text(sample.text):\n            raise TransformAnalysisInputError("schedule row source text hash does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
                  assert old in text
                  text = text.replace(old, new, 1)
              if 'variants from one source must share one pristine score' not in text:
                  old = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
                  new = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    for source_sample_id in {row.source_sample_id for row in rows}:\n        source_rows = tuple(row for row in rows if row.source_sample_id == source_sample_id)\n        if len({row.pristine_score for row in source_rows}) != 1:\n            raise TransformAnalysisInputError("variants from one source must share one pristine score")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
                  assert old in text
                  text = text.replace(old, new, 1)
              pair_marker = '''        row.candidate_pool_hash,\n        row.scheduler_input_hash,\n        row.budget,\n'''
              if pair_marker not in text:
                  old = '''        row.candidate_pool_hash,\n        row.budget,\n'''
                  assert old in text
                  text = text.replace(old, pair_marker, 1)
              signature = '''def _validate_schedule_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n    *,\n    allow_secret_access: bool = False,\n) -> tuple[str, str, float]:\n'''
              if signature not in text:
                  old = '''def _validate_schedule_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n) -> tuple[str, str, float]:\n'''
                  assert old in text
                  text = text.replace(old, signature, 1)
              if 'secret access contaminates key-blind schedule analysis' not in text:
                  old = '''    if len({row.row_hash for row in rows}) != len(rows):\n        raise TransformAnalysisInputError("schedule analysis rows must not contain duplicate artifacts")\n    sample_by_id = _expected_attack_sources(artifact)\n'''
                  new = '''    if len({row.row_hash for row in rows}) != len(rows):\n        raise TransformAnalysisInputError("schedule analysis rows must not contain duplicate artifacts")\n    if type(allow_secret_access) is not bool:\n        raise TypeError("allow_secret_access must be a bool")\n    if not allow_secret_access and any(row.secret_access_observed for row in rows):\n        raise TransformAnalysisInputError("secret access contaminates key-blind schedule analysis")\n    sample_by_id = _expected_attack_sources(artifact)\n'''
                  assert old in text
                  text = text.replace(old, new, 1)
              marker = 'def run_e11_greedy_comparison('
              index = text.index(marker)
              head, tail = text[:index], text[index:]
              desired = '    detector_identity_hash, threshold_hash, _ = _validate_schedule_rows(artifact, rows, allow_secret_access=True)\n'
              if desired not in tail:
                  old = '    detector_identity_hash, threshold_hash, _ = _validate_schedule_rows(artifact, rows)\n'
                  assert old in tail
                  tail = tail.replace(old, desired, 1)
                  text = head + tail
              path.write_text(text)

          def patch_transform_analysis() -> None:
              path = Path('fuckmark/experiments/transform_analysis.py')
              text = path.read_text()
              if 'secret access contaminates E07/E08 key-blind analysis' not in text:
                  old = '''def _validate_tiny_attack_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n) -> tuple[str, str, tuple[str, ...]]:\n    expected_samples = tuple(\n'''
                  new = '''def _validate_tiny_attack_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n) -> tuple[str, str, tuple[str, ...]]:\n    if any(row.secret_access_observed for row in rows):\n        raise TransformAnalysisInputError("secret access contaminates E07/E08 key-blind analysis")\n    expected_samples = tuple(\n'''
                  assert old in text
                  text = text.replace(old, new, 1)
              path.write_text(text)

          def patch_calibration_if_needed() -> None:
              sys.path.insert(0, 'tests')
              from tiny_dev_experiment_helpers import calibration_evidence, tiny_dev_artifact
              from fuckmark.experiments.development_calibration import calibrate_tiny_dev_detector
              from fuckmark.hashing import sha256_json

              binding = calibrate_tiny_dev_detector(tiny_dev_artifact(), calibration_evidence())
              threshold = binding.calibration_bundle.thresholds[-1]
              interval_field = next(name for name in ('confidence_interval', 'fpr_interval') if hasattr(threshold, name))
              interval = getattr(threshold, interval_field)
              payload = threshold._payload()
              interval_payload_key = next(key for key, value in payload.items() if value == interval)
              try:
                  forged_interval = replace(interval, lower=0.0, upper=1.0)
                  forged_payload = dict(payload)
                  forged_payload[interval_payload_key] = forged_interval
                  replace(threshold, **{interval_field: forged_interval, 'threshold_hash': sha256_json(forged_payload)})
              except ValueError:
                  return
              threshold_fields = {field.name for field in fields(type(threshold))}
              assert 'false_positive_count' in threshold_fields and 'calibration_count' in threshold_fields
              confidence_attr = next(name for name in ('confidence_level', 'confidence') if hasattr(interval, name))
              path = Path('fuckmark/detectors/calibration_threshold.py')
              text = path.read_text()
              marker = 'confidence interval does not match exact binomial interval'
              if marker in text:
                  return
              tree = ast.parse(text)
              target = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == 'CalibrationThreshold':
                      target = next(child for child in node.body if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name == '__post_init__')
                      break
              assert target is not None and target.end_lineno is not None
              insertion = (
                  '        from .calibration_statistics import exact_binomial_interval\n'
                  '        expected_interval = exact_binomial_interval(\n'
                  '            self.false_positive_count,\n'
                  '            self.calibration_count,\n'
                  f'            self.{interval_field}.{confidence_attr},\n'
                  '        )\n'
                  f'        if self.{interval_field} != expected_interval:\n'
                  '            raise ValueError("confidence interval does not match exact binomial interval")\n'
              )
              lines = text.splitlines(keepends=True)
              lines[target.end_lineno:target.end_lineno] = [insertion]
              path.write_text(''.join(lines))

          def patch_token_ngram_if_needed() -> None:
              from fuckmark.observations import build_token_ngrams
              ngram = build_token_ngrams((10, 20, 30, 40), 3)[0]
              try:
                  replace(ngram, index=ngram.index + 1)
              except ValueError:
                  return
              path = Path('fuckmark/observations.py')
              text = path.read_text()
              marker = 'token n-gram index/start geometry mismatch'
              if marker in text:
                  return
              tree = ast.parse(text)
              target = None
              for node in tree.body:
                  if isinstance(node, ast.ClassDef) and node.name == 'TokenNgram':
                      target = next(child for child in node.body if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name == '__post_init__')
                      break
              assert target is not None and target.end_lineno is not None
              insertion = (
                  '        if self.index != self.start:\n'
                  '            raise ValueError("token n-gram index/start geometry mismatch")\n'
              )
              lines = text.splitlines(keepends=True)
              lines[target.end_lineno:target.end_lineno] = [insertion]
              path.write_text(''.join(lines))

          patch_schedule()
          patch_transform_analysis()
          patch_calibration_if_needed()
          patch_token_ngram_if_needed()
          PY
      - name: Full test suite
        run: python -m pytest -q

  commit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Rebase on latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Apply converged hardening
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import sys
          from dataclasses import fields, replace
          from pathlib import Path

          schedule_path = Path('fuckmark/experiments/schedule_analysis.py')
          schedule = schedule_path.read_text()
          if 'from ..hashing import sha256_json, sha256_text' not in schedule:
              old = 'from ..hashing import sha256_json\n'; assert old in schedule
              schedule = schedule.replace(old, 'from ..hashing import sha256_json, sha256_text\n', 1)
          if 'schedule row source text hash does not match corpus source' not in schedule:
              old = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
              new = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.source_text_hash != sha256_text(sample.text):\n            raise TransformAnalysisInputError("schedule row source text hash does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
              assert old in schedule; schedule = schedule.replace(old, new, 1)
          if 'variants from one source must share one pristine score' not in schedule:
              old = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
              new = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    for source_sample_id in {row.source_sample_id for row in rows}:\n        source_rows = tuple(row for row in rows if row.source_sample_id == source_sample_id)\n        if len({row.pristine_score for row in source_rows}) != 1:\n            raise TransformAnalysisInputError("variants from one source must share one pristine score")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
              assert old in schedule; schedule = schedule.replace(old, new, 1)
          pair_marker = '''        row.candidate_pool_hash,\n        row.scheduler_input_hash,\n        row.budget,\n'''
          if pair_marker not in schedule:
              old = '''        row.candidate_pool_hash,\n        row.budget,\n'''; assert old in schedule
              schedule = schedule.replace(old, pair_marker, 1)
          signature = '''def _validate_schedule_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n    *,\n    allow_secret_access: bool = False,\n) -> tuple[str, str, float]:\n'''
          if signature not in schedule:
              old = '''def _validate_schedule_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n) -> tuple[str, str, float]:\n'''; assert old in schedule
              schedule = schedule.replace(old, signature, 1)
          if 'secret access contaminates key-blind schedule analysis' not in schedule:
              old = '''    if len({row.row_hash for row in rows}) != len(rows):\n        raise TransformAnalysisInputError("schedule analysis rows must not contain duplicate artifacts")\n    sample_by_id = _expected_attack_sources(artifact)\n'''
              new = '''    if len({row.row_hash for row in rows}) != len(rows):\n        raise TransformAnalysisInputError("schedule analysis rows must not contain duplicate artifacts")\n    if type(allow_secret_access) is not bool:\n        raise TypeError("allow_secret_access must be a bool")\n    if not allow_secret_access and any(row.secret_access_observed for row in rows):\n        raise TransformAnalysisInputError("secret access contaminates key-blind schedule analysis")\n    sample_by_id = _expected_attack_sources(artifact)\n'''
              assert old in schedule; schedule = schedule.replace(old, new, 1)
          marker = 'def run_e11_greedy_comparison('
          index = schedule.index(marker); head, tail = schedule[:index], schedule[index:]
          desired = '    detector_identity_hash, threshold_hash, _ = _validate_schedule_rows(artifact, rows, allow_secret_access=True)\n'
          if desired not in tail:
              old = '    detector_identity_hash, threshold_hash, _ = _validate_schedule_rows(artifact, rows)\n'; assert old in tail
              tail = tail.replace(old, desired, 1); schedule = head + tail
          schedule_path.write_text(schedule)

          analysis_path = Path('fuckmark/experiments/transform_analysis.py')
          analysis = analysis_path.read_text()
          if 'secret access contaminates E07/E08 key-blind analysis' not in analysis:
              old = '''def _validate_tiny_attack_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n) -> tuple[str, str, tuple[str, ...]]:\n    expected_samples = tuple(\n'''
              new = '''def _validate_tiny_attack_rows(\n    artifact: TinyDevCorpusArtifact,\n    rows: tuple[DevelopmentTransformRow, ...],\n) -> tuple[str, str, tuple[str, ...]]:\n    if any(row.secret_access_observed for row in rows):\n        raise TransformAnalysisInputError("secret access contaminates E07/E08 key-blind analysis")\n    expected_samples = tuple(\n'''
              assert old in analysis; analysis = analysis.replace(old, new, 1)
          analysis_path.write_text(analysis)

          sys.path.insert(0, 'tests')
          from tiny_dev_experiment_helpers import calibration_evidence, tiny_dev_artifact
          from fuckmark.experiments.development_calibration import calibrate_tiny_dev_detector
          from fuckmark.hashing import sha256_json
          binding = calibrate_tiny_dev_detector(tiny_dev_artifact(), calibration_evidence())
          threshold = binding.calibration_bundle.thresholds[-1]
          interval_field = next(name for name in ('confidence_interval', 'fpr_interval') if hasattr(threshold, name))
          interval = getattr(threshold, interval_field); payload = threshold._payload()
          interval_payload_key = next(key for key, value in payload.items() if value == interval)
          vulnerable = False
          try:
              forged_interval = replace(interval, lower=0.0, upper=1.0)
              forged_payload = dict(payload); forged_payload[interval_payload_key] = forged_interval
              replace(threshold, **{interval_field: forged_interval, 'threshold_hash': sha256_json(forged_payload)})
          except ValueError:
              pass
          else:
              vulnerable = True
          if vulnerable:
              threshold_fields = {field.name for field in fields(type(threshold))}; assert 'false_positive_count' in threshold_fields and 'calibration_count' in threshold_fields
              confidence_attr = next(name for name in ('confidence_level', 'confidence') if hasattr(interval, name))
              path = Path('fuckmark/detectors/calibration_threshold.py'); text = path.read_text()
              if 'confidence interval does not match exact binomial interval' not in text:
                  tree = ast.parse(text); target = None
                  for node in tree.body:
                      if isinstance(node, ast.ClassDef) and node.name == 'CalibrationThreshold':
                          target = next(child for child in node.body if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name == '__post_init__'); break
                  assert target is not None and target.end_lineno is not None
                  insertion = ('        from .calibration_statistics import exact_binomial_interval\n' '        expected_interval = exact_binomial_interval(\n' '            self.false_positive_count,\n' '            self.calibration_count,\n' f'            self.{interval_field}.{confidence_attr},\n' '        )\n' f'        if self.{interval_field} != expected_interval:\n' '            raise ValueError("confidence interval does not match exact binomial interval")\n')
                  lines = text.splitlines(keepends=True); lines[target.end_lineno:target.end_lineno] = [insertion]; path.write_text(''.join(lines))

          from fuckmark.observations import build_token_ngrams
          ngram = build_token_ngrams((10, 20, 30, 40), 3)[0]
          try:
              replace(ngram, index=ngram.index + 1)
          except ValueError:
              pass
          else:
              path = Path('fuckmark/observations.py'); text = path.read_text()
              if 'token n-gram index/start geometry mismatch' not in text:
                  tree = ast.parse(text); target = None
                  for node in tree.body:
                      if isinstance(node, ast.ClassDef) and node.name == 'TokenNgram':
                          target = next(child for child in node.body if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)) and child.name == '__post_init__'); break
                  assert target is not None and target.end_lineno is not None
                  insertion = '        if self.index != self.start:\n            raise ValueError("token n-gram index/start geometry mismatch")\n'
                  lines = text.splitlines(keepends=True); lines[target.end_lineno:target.end_lineno] = [insertion]; path.write_text(''.join(lines))
          PY
      - name: Full latest-main test suite
        run: python -m pytest -q
      - name: Commit converged hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/patch-schedule-identity.yml .github/workflows/patch-experiment-key-blind.yml .github/workflows/patch-calibration-interval.yml .github/workflows/finalize-task27-hardening.yml
          git add fuckmark/experiments/schedule_analysis.py fuckmark/experiments/transform_analysis.py fuckmark/detectors/calibration_threshold.py fuckmark/observations.py tests/test_calibration_interval_integrity.py tests/test_token_ngram_geometry_integrity.py tests/test_experiment_key_blind_boundary.py tests/test_e09_random_baseline.py tests/test_e10_spacing_comparison.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Converge Task 27 integrity hardening"
          git push origin HEAD:main
          git push origin --delete __probe_invalid__ || true
