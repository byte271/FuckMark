name: SynthID Schedule Stress PR Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'feat/synthid-geometry-headroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install CPU Torch
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install SynthID experiment dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run first real public-geometry headroom stress probe
        run: >-
          python -m fuckmark.synthid_schedule_stress_hf
          --model openai-community/gpt2
          --device cpu
          --prompt-limit 6
          --max-new-tokens 160
          --registry release
          --budgets 1,2,4
          --random-seed-count 8
          --seed-base 273000
          --schedule-seed-base 9300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-schedule-stress-pr-probe
          path: artifacts/
          if-no-files-found: warn
