name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Test installed CLI end to end
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$RUNNER_TEMP/fuckmark-bin"
          mkdir -p "$test_bin"
          cat > "$test_bin/wl-copy" <<'SH'
          #!/usr/bin/env sh
          cat > "$FUCKMARK_CLIPBOARD_CAPTURE"
          SH
          chmod +x "$test_bin/wl-copy"
          export PATH="$test_bin:$PATH"
          for command in FuckMark Fuckmark fuckmark; do
            command -v "$command"
            capture="$RUNNER_TEMP/${command}.clipboard"
            export FUCKMARK_CLIPBOARD_CAPTURE="$capture"
            output="$(printf 'I do not agree and I cannot stay.\nok\n' | "$command")"
            printf '%s\n' "$output"
            grep -Fq 'Processing...' <<< "$output"
            grep -Fq 'Success. Copied to clipboard.' <<< "$output"
            test "$(cat "$capture")" = "I don't agree and I can't stay."
          done

  synthid-smoke:
    name: Open SynthID smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/synthid-smoke-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FuckMark
        run: python -m pip install -e .

      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt

      - name: Run open SynthID smoke
        run: python -m fuckmark.synthid_smoke_hf --model openai-community/gpt2 --device cpu --prompt-limit 6 --max-new-tokens 96

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-smoke
          path: artifacts/
          if-no-files-found: warn
