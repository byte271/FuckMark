name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install "uv==0.10.0" && python -m pip install -e ".[dev]"

      - name: Verify dependency lock
        run: uv lock --check --python "${{ matrix.python-version }}"

      - name: Test
        run: python -m pytest -q

      - name: Test installed CLI end to end
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$RUNNER_TEMP/fuckmark-bin"
          mkdir -p "$test_bin"
          cat > "$test_bin/wl-copy" <<'SH'
          #!/usr/bin/env sh
          cat > "$FUCKMARK_CLIPBOARD_CAPTURE"
          SH
          chmod +x "$test_bin/wl-copy"
          export PATH="$test_bin:$PATH"
          for command in FuckMark Fuckmark fuckmark; do
            command -v "$command"
            capture="$RUNNER_TEMP/${command}.clipboard"
            export FUCKMARK_CLIPBOARD_CAPTURE="$capture"
            output="$(printf 'I do not agree and I cannot stay.\nok\n' | "$command")"
            printf '%s\n' "$output"
            grep -Fq 'Processing...' <<< "$output"
            grep -Fq 'Success. Copied to clipboard.' <<< "$output"
            test "$(cat "$capture")" = "I don't agree and I can't stay."
          done
