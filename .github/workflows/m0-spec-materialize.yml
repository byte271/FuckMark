name: M0 Frozen Spec Materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct and verify frozen revision-2 specification
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .m0-spec-parts -maxdepth 1 -type f -name '*.b64' | wc -l)" -eq 10
          cat .m0-spec-parts/*.b64 | base64 --decode | xz --decompress --stdout > spec.md
          printf '%s  %s\n' '089e32ab5477038adbb47b63eeaeddd1fa95dfcd226f1770d8b174ead088dc9a' 'spec.md' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(wc -c < spec.md)" -eq 145372
      - name: Commit immutable source-freeze artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .m0-spec-parts
          git rm .github/workflows/m0-lock-pr-probe.yml
          git rm .github/workflows/m0-spec-materialize.yml
          git add -f spec.md
          git add SHA256SUMS.txt
          git commit -m 'Materialize frozen revision-2 research specification'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
