name: MidDev STRICT Candidate Density

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/middev-strict-candidate-density.yml"
      - "fuckmark/experiments/candidate_density_audit.py"
      - "fuckmark/tiny_dev_candidate_density_hf.py"
      - "fuckmark/search/beam_v3_promotion.py"
      - "tests/test_candidate_density_audit.py"
      - "tests/test_beam_v3_promotion.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/candidate-density-validation-trigger"
      - ".github/workflows/middev-strict-candidate-density.yml"
      - "fuckmark/experiments/candidate_density_audit.py"
      - "fuckmark/tiny_dev_candidate_density_hf.py"
      - "fuckmark/search/beam_v3_promotion.py"
      - "tests/test_candidate_density_audit.py"
      - "tests/test_beam_v3_promotion.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_TINYDEV_RUN_ID: "32269591897"
  FROZEN_TINYDEV_ARTIFACT_NAME: real-tiny-dev-context-survival
  FROZEN_TINYDEV_CORPUS_FILE_SHA256: ee09527d06abc58e612f7157b69908d5abe06101865714ce13a1287d1f0d7664

jobs:
  unit:
    name: STRICT density unit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install "uv==0.10.0" && python -m pip install -e ".[dev]"
      - name: Verify dependency lock
        run: uv lock --check --python "${{ matrix.python-version }}"
      - name: Run candidate-density and v3 kill-lock tests
        run: >-
          python -m pytest -q
          tests/test_candidate_density_audit.py
          tests/test_beam_v3_promotion.py
          tests/test_beam_v2.py
          tests/test_context_survival.py
      - name: Verify detector-free imports
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path('fuckmark/experiments/candidate_density_audit.py'),
              Path('fuckmark/tiny_dev_candidate_density_hf.py'),
          ):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              imported = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imported.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imported.append(node.module or '')
              banned = sorted(name for name in imported if any(token in name.lower() for token in ('detector', 'scorer', 'scoring', 'secret', 'g_value', 'gvalue')))
              if banned:
                  raise SystemExit(f'{path}: prohibited import(s): {banned}')
          print('candidate-density-import-firewall=PASS')
          PY

  frozen-tinydev-density:
    name: Frozen TinyDev STRICT candidate density
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e ".[dev]"
      - name: Install exact CPU Torch runtime
        run: python -m pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install frozen public tokenizer runtime
        run: python -m pip install -r requirements-smoke.txt
      - name: Download sealed TinyDev baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FROZEN_TINYDEV_ARTIFACT_NAME }}
          path: frozen-tinydev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: byte271/FuckMark
          run-id: ${{ env.FROZEN_TINYDEV_RUN_ID }}
      - name: Verify frozen TinyDev corpus file hash
        shell: bash
        run: |
          actual="$(sha256sum frozen-tinydev/tiny-dev-corpus.json | cut -d' ' -f1)"
          test "$actual" = "$FROZEN_TINYDEV_CORPUS_FILE_SHA256"
      - name: Verify Beam v3 remains killed
        run: |
          python - <<'PY'
          from fuckmark.search.beam_v3_promotion import FROZEN_BEAM_V3_PROMOTION_LOCK
          assert FROZEN_BEAM_V3_PROMOTION_LOCK.promoted is False
          assert FROZEN_BEAM_V3_PROMOTION_LOCK.gate_decision == 'K2_V3_SEARCH_HAS_NO_MATCHED_COST_GAIN'
          assert FROZEN_BEAM_V3_PROMOTION_LOCK.canonical_algorithm_version == 'context-survival-beam-v2'
          print('beam-v3-kill-lock=PASS')
          PY
      - name: Run detector-free STRICT candidate-density audit
        run: >-
          python -m fuckmark.tiny_dev_candidate_density_hf
          --corpus-json frozen-tinydev/tiny-dev-corpus.json
          --model openai-community/gpt2
          --model-revision 607a30d783dfa663caf39e06633721c8d4cfcd7e
          --source-code-commit "$GITHUB_SHA"
          --artifact-json candidate-density-artifacts/tiny-dev-strict-candidate-density.json
      - name: Upload candidate-density artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: middev-strict-candidate-density-${{ github.sha }}
          path: candidate-density-artifacts/
          if-no-files-found: error
      - name: Report frozen scarcity classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact = json.loads(Path('candidate-density-artifacts/tiny-dev-strict-candidate-density.json').read_text(encoding='utf-8'))
          print('decision=' + artifact['decision'])
          print('artifact_hash=' + artifact['artifact_hash'])
          if artifact['decision'] not in {
              'STRICT_B4_CANDIDATE_SCARCITY',
              'STRICT_B6_CANDIDATE_SCARCITY',
              'NO_STRICT_REACHABILITY_SCARCITY',
          }:
              raise SystemExit('unknown candidate-density classification')
          PY
