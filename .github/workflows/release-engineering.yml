name: Release Engineering

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-engineering.yml"
      - "fuckmark/**"
      - "tests/**"
      - "tools/verify_release_install.py"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Publish a GitHub Release for the existing v<pyproject version> tag. This job never creates tags and never deletes branches.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-e2e:
    name: Package E2E / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Clean-install and verify both distributions
        run: python tools/verify_release_install.py dist

      - name: Upload release distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_github_release == true
    needs: package-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require existing version tag
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          release_tag="v${package_version}"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/$release_tag" >/dev/null; then
            printf '%s\n' "Tag $release_tag does not exist. Create and push that tag before publishing."
            exit 1
          fi
          tagged_sha="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
            printf '%s\n' "Tag $release_tag points at $tagged_sha, not this commit $GITHUB_SHA."
            exit 1
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified distributions
        if: steps.state.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: release-dist

      - name: Create release if missing
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.state.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-dist/* --verify-tag --title "FuckMark $RELEASE_TAG" --generate-notes
