name: Release Engineering

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-engineering.yml"
      - "fuckmark/**"
      - "tests/**"
      - "tools/verify_release_install.py"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-e2e:
    name: Package E2E / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Clean-install and verify both distributions
        run: python tools/verify_release_install.py dist

      - name: Upload release distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.1.0')
    needs: package-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: release-dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$RELEASE_TAG" release-dist/* --verify-tag --title "FuckMark $RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" release-dist/* --target "$GITHUB_SHA" --title "FuckMark $RELEASE_TAG" --generate-notes
          fi

  cleanup-merged-branches:
    name: Remove merged branches
    if: needs.release.result == 'success'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged pull-request branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" | jq -r --arg repo "$GITHUB_REPOSITORY" '.[][] | select(.merged_at != null and .head.repo.full_name == $repo) | .head.ref' | sort -u)"
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            encoded="$(jq -rn --arg value "$branch" '$value | @uri')"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" || true
          done <<< "$branches"
