name: M0 Lockfile PR Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install "uv==0.10.0"
      - name: Resolve frozen project lock
        run: uv lock --python 3.12
      - name: Verify lock is stable
        run: uv lock --check --python 3.12
      - uses: actions/upload-artifact@v4
        with:
          name: m0-uv-lock
          path: uv.lock
          if-no-files-found: error
