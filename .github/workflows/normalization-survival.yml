name: Normalization Survival Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/normalization-survival.yml"
      - "fuckmark/normalization_survival_benchmark.py"
      - "fuckmark/experiments/normalization_survival.py"
      - "fuckmark/experiments/diverse_beam_corpus.py"
      - "fuckmark/transforms/**"
      - "tests/test_normalization_survival.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_CODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_WORKFLOW_RUN_ID: "32504847438"

jobs:
  preflight:
    name: Verify frozen normalizers and artifact replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest
          tests/test_normalization_survival.py
          tests/test_repository_hygiene.py

  benchmark:
    name: Measure 500 frozen real samples
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: diverse-beam-frozen-corpus
          path: source-corpus
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_WORKFLOW_RUN_ID }}
      - name: Run detector-blind normalization benchmark
        run: >-
          python -m fuckmark.normalization_survival_benchmark
          --corpus-json source-corpus/diverse-beam-frozen-corpus.json
          --source-code-commit "$SOURCE_CODE_COMMIT"
          --source-workflow-run-id "$SOURCE_WORKFLOW_RUN_ID"
          --json normalization-artifact/normalization-survival-benchmark.json
      - name: Freeze evidence checksums
        run: >-
          sha256sum normalization-artifact/normalization-survival-benchmark.json
          > normalization-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: normalization-survival-benchmark
          path: normalization-artifact/
          if-no-files-found: error
          retention-days: 90
