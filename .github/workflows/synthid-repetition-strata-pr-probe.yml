name: SynthID Repetition Strata PR Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'feat/repetition-stratified-headroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install CPU Torch
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install SynthID experiment dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run one-time real repetition-strata probe
        run: >-
          python -m fuckmark.synthid_repetition_strata_hf
          --model openai-community/gpt2
          --device cpu
          --prompt-limit 16
          --seed-base 278000
          --max-new-tokens 192
          --registry mechanism
          --budgets 1,2,4
          --schedule-seed 9700
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-repetition-strata-pr-probe
          path: artifacts/
          if-no-files-found: warn
