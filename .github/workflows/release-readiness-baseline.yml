name: Release Readiness Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-baseline:
    name: Verify frozen v0.1.0 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_release_readiness_baseline.py tests/test_repository_hygiene.py
      - run: >-
          python -m fuckmark.release_readiness_baseline
          --repository-root .
          --verify-json specs/fuckmark-v0.1.0-release-readiness-baseline.json

  artifact-install:
    name: Build and install baseline artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install "uv==0.10.0"
      - run: uv build
      - name: Install wheel and sdist in clean environments
        run: python tools/verify_release_install.py dist
