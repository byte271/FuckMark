name: Release Readiness Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-baseline:
    name: Verify frozen v0.1.0 baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install "uv==0.10.0" && python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_release_readiness_baseline.py tests/test_repository_hygiene.py
      - run: >-
          python -m fuckmark.release_readiness_baseline
          --repository-root .
          --verify-json specs/fuckmark-v0.1.0-release-readiness-baseline.json

  artifact-install:
    name: Build and install baseline artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install "uv==0.10.0"
      - run: uv build
      - name: Install wheel and sdist in clean environments
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-env"
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/fuckmark-0.1.0-py3-none-any.whl
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install --no-deps dist/fuckmark-0.1.0.tar.gz
          for env_dir in "$RUNNER_TEMP/wheel-env" "$RUNNER_TEMP/sdist-env"; do
            "$env_dir/bin/python" -I -c 'import fuckmark; assert fuckmark.__version__ == "0.1.0"'
            "$env_dir/bin/python" -m pip check
          done
          test_bin="$RUNNER_TEMP/fuckmark-bin"
          mkdir -p "$test_bin"
          printf '#!/usr/bin/env sh\ncat > "$FUCKMARK_CLIPBOARD_CAPTURE"\n' > "$test_bin/wl-copy"
          chmod +x "$test_bin/wl-copy"
          cd "$RUNNER_TEMP"
          for env_dir in "$RUNNER_TEMP/wheel-env" "$RUNNER_TEMP/sdist-env"; do
            for command in FuckMark Fuckmark fuckmark; do
              capture="$RUNNER_TEMP/$(basename "$env_dir")-${command}.clipboard"
              export FUCKMARK_CLIPBOARD_CAPTURE="$capture"
              output="$(printf 'I do not agree and I cannot stay.\nok\n' | PATH="$test_bin:$env_dir/bin:$PATH" "$env_dir/bin/$command")"
              grep -Fq 'Success. Copied to clipboard.' <<< "$output"
              test "$(cat "$capture")" = "I don't agree and I can't stay."
            done
          done
