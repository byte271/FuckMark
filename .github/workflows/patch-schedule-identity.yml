name: Schedule identity hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-schedule-identity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Apply identity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fuckmark/experiments/schedule_analysis.py')
          text = path.read_text()
          if 'from ..hashing import sha256_json, sha256_text' not in text:
              old = 'from ..hashing import sha256_json\n'
              assert old in text
              text = text.replace(old, 'from ..hashing import sha256_json, sha256_text\n', 1)
          guard = 'schedule row source text hash does not match corpus source'
          if guard not in text:
              old = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
              new = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.source_text_hash != sha256_text(sample.text):\n            raise TransformAnalysisInputError("schedule row source text hash does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
              assert old in text
              text = text.replace(old, new, 1)
          pristine = 'variants from one source must share one pristine score'
          if pristine not in text:
              old = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
              new = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    for source_sample_id in {row.source_sample_id for row in rows}:\n        source_rows = tuple(row for row in rows if row.source_sample_id == source_sample_id)\n        if len({row.pristine_score for row in source_rows}) != 1:\n            raise TransformAnalysisInputError("variants from one source must share one pristine score")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
              assert old in text
              text = text.replace(old, new, 1)
          marker = '''        row.candidate_pool_hash,\n        row.scheduler_input_hash,\n        row.budget,\n'''
          if marker not in text:
              old = '''        row.candidate_pool_hash,\n        row.budget,\n'''
              assert old in text
              text = text.replace(old, marker, 1)
          assert 'from ..hashing import sha256_json, sha256_text' in text
          assert guard in text
          assert pristine in text
          assert marker in text
          path.write_text(text)
          PY
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  commit:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply identity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fuckmark/experiments/schedule_analysis.py')
          text = path.read_text()
          if 'from ..hashing import sha256_json, sha256_text' not in text:
              old = 'from ..hashing import sha256_json\n'
              assert old in text
              text = text.replace(old, 'from ..hashing import sha256_json, sha256_text\n', 1)
          guard = 'schedule row source text hash does not match corpus source'
          if guard not in text:
              old = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
              new = '''        if row.prompt_family_id != sample.prompt_family_id:\n            raise TransformAnalysisInputError("schedule row prompt family does not match corpus source")\n        if row.source_text_hash != sha256_text(sample.text):\n            raise TransformAnalysisInputError("schedule row source text hash does not match corpus source")\n        if row.key_split is not KeySplit.DEV:\n'''
              assert old in text
              text = text.replace(old, new, 1)
          pristine = 'variants from one source must share one pristine score'
          if pristine not in text:
              old = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
              new = '''    if not rows:\n        raise TransformAnalysisInputError("schedule analysis requires at least one row")\n    for source_sample_id in {row.source_sample_id for row in rows}:\n        source_rows = tuple(row for row in rows if row.source_sample_id == source_sample_id)\n        if len({row.pristine_score for row in source_rows}) != 1:\n            raise TransformAnalysisInputError("variants from one source must share one pristine score")\n    detector_ids = {row.detector_identity_hash for row in rows}\n'''
              assert old in text
              text = text.replace(old, new, 1)
          marker = '''        row.candidate_pool_hash,\n        row.scheduler_input_hash,\n        row.budget,\n'''
          if marker not in text:
              old = '''        row.candidate_pool_hash,\n        row.budget,\n'''
              assert old in text
              text = text.replace(old, marker, 1)
          assert 'from ..hashing import sha256_json, sha256_text' in text
          assert guard in text
          assert pristine in text
          assert marker in text
          path.write_text(text)
          PY
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-schedule-identity.yml
          git add fuckmark/experiments/schedule_analysis.py
          git commit -m "Harden schedule analysis identity binding"
          git push origin HEAD:main
          git push origin --delete __probe_invalid__ || true
