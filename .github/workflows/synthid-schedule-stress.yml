name: SynthID Schedule Stress

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face causal language model
        required: true
        default: openai-community/gpt2
        type: string
      prompt_limit:
        description: Number of mechanism-stress prompts
        required: true
        default: "8"
        type: string
      max_new_tokens:
        description: Generated completion tokens per sample
        required: true
        default: "192"
        type: string
      registry:
        description: Transform registry used by the exploratory stress analysis
        required: true
        default: release
        type: choice
        options:
          - release
          - development
      budgets:
        description: Comma-separated operation budgets
        required: true
        default: "1,2,4"
        type: string
      random_seed_count:
        description: Random schedules per source and budget
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install CPU Torch
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install SynthID experiment dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run public-geometry headroom stress analysis
        run: >-
          python -m fuckmark.synthid_schedule_stress_hf
          --model "${{ inputs.model }}"
          --device cpu
          --prompt-limit "${{ inputs.prompt_limit }}"
          --max-new-tokens "${{ inputs.max_new_tokens }}"
          --registry "${{ inputs.registry }}"
          --budgets "${{ inputs.budgets }}"
          --random-seed-count "${{ inputs.random_seed_count }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-schedule-stress-${{ inputs.registry }}
          path: artifacts/
          if-no-files-found: warn
