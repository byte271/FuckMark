name: MidDev Full Matrix Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mid-dev-plan-matrix.yml"
      - "fuckmark/corpus/mid_dev*.py"
      - "fuckmark/experiments/mid_dev*.py"
      - "fuckmark/scheduling/**"
      - "fuckmark/transforms/**"
      - "tests/test_mid_dev_plan_builder.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install "uv==0.10.0" && python -m pip install -e ".[dev]"
      - name: Verify dependency lock
        run: uv lock --check --python "3.12"
      - name: Run complete fake MidDev plan matrix
        env:
          FUCKMARK_RUN_MIDDEV_FULL_MATRIX: "1"
        run: python -m pytest -q tests/test_mid_dev_plan_builder.py
