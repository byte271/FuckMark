name: SynthID Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face causal language model
        required: true
        default: openai-community/gpt2
        type: string
      prompt_limit:
        description: Number of built-in smoke prompts
        required: true
        default: "20"
        type: string
      max_new_tokens:
        description: Generated completion tokens per sample
        required: true
        default: "128"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install CPU Torch
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run open SynthID smoke
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_PROMPT_LIMIT: ${{ inputs.prompt_limit }}
          INPUT_MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
        run: python -m fuckmark.synthid_smoke_hf --model "$INPUT_MODEL" --device cpu --prompt-limit "$INPUT_PROMPT_LIMIT" --max-new-tokens "$INPUT_MAX_NEW_TOKENS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-smoke
          path: artifacts/
          if-no-files-found: warn
