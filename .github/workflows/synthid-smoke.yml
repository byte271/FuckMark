name: SynthID Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "fuckmark/synthid_smoke_hf.py"
      - "fuckmark/experiments/synthid_smoke.py"
      - "requirements-smoke.txt"
      - ".github/workflows/synthid-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FuckMark
        run: python -m pip install -e .
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run open SynthID smoke
        run: python -m fuckmark.synthid_smoke_hf --model openai-community/gpt2 --device cpu --prompt-limit 6 --max-new-tokens 96
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthid-smoke
          path: artifacts/
          if-no-files-found: warn
