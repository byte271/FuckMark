[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuckmark"
version = "0.1.0"
description = "FuckMark deterministic research infrastructure for statistical text watermark robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Byte271" }]
keywords = ["watermark", "text", "robustness", "research", "synthid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/byte271/FuckMark"
Repository = "https://github.com/byte271/FuckMark"
Issues = "https://github.com/byte271/FuckMark/issues"

[project.scripts]
FuckMark = "fuckmark.cli:main"
Fuckmark = "fuckmark.cli:main"
fuckmark = "fuckmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["fuckmark*"]
