[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuckmark"
version = "0.1.0"
description = "FuckMark deterministic research infrastructure for statistical text watermark robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/byte271/FuckMark"
Repository = "https://github.com/byte271/FuckMark"
Issues = "https://github.com/byte271/FuckMark/issues"

[project.scripts]
FuckMark = "fuckmark.cli:main"
Fuckmark = "fuckmark.cli:main"
fuckmark = "fuckmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["fuckmark*"]
