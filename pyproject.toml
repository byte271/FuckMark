[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuckmark"
version = "0.4.1"
description = "CLI that inserts frozen invisible Unicode into English ASCII text without changing what you see. Constrained SynthID results; not a general watermark remover."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Byte271" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["watermark", "text", "robustness", "research", "synthid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://mark.q1z.org"
Repository = "https://github.com/byte271/FuckMark"
Issues = "https://github.com/byte271/FuckMark/issues"

[project.scripts]
FuckMark = "fuckmark.cli:main"
Fuckmark = "fuckmark.cli:main"
fuckmark = "fuckmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "markdown-it-py==4.2.0"]
research = ["fonttools>=4.50", "uharfbuzz>=0.39", "tokenizers>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["fuckmark*"]

[tool.setuptools.package-data]
fuckmark = ["webui/*.html"]
