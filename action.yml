name: "FuckMark hidden-Unicode scan"
description: "Fail the build on hidden or malicious Unicode: Trojan Source bidi overrides, zero-width characters, and Unicode tag smuggling."
author: "Byte271"
branding:
  icon: "eye"
  color: "purple"

inputs:
  paths:
    description: "Space-separated files or directories to scan."
    required: false
    default: "."
  select:
    description: "Comma-separated categories to fail on, or 'all' for every category."
    required: false
    default: "bidi_control,zero_width,tag,control,noncharacter,surrogate"
  fix:
    description: "Strip the selected hidden characters in place instead of only reporting."
    required: false
    default: "false"
  json:
    description: "Emit a machine-readable JSON report to the step output."
    required: false
    default: "false"
  args:
    description: "Extra raw arguments passed through to 'fuckmark lint'."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install FuckMark
      shell: bash
      run: python3 -m pip install --disable-pip-version-check --quiet "${{ github.action_path }}"
    - name: Scan for hidden Unicode
      shell: bash
      env:
        FUCKMARK_SELECT: ${{ inputs.select }}
        FUCKMARK_FIX: ${{ inputs.fix }}
        FUCKMARK_JSON: ${{ inputs.json }}
        FUCKMARK_ARGS: ${{ inputs.args }}
        FUCKMARK_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        import shlex
        import subprocess

        cmd = ["fuckmark", "lint", "--select", os.environ.get("FUCKMARK_SELECT", "")]
        if os.environ.get("FUCKMARK_FIX", "").strip().casefold() == "true":
            cmd.append("--fix")
        if os.environ.get("FUCKMARK_JSON", "").strip().casefold() == "true":
            cmd.append("--json")
        extra = os.environ.get("FUCKMARK_ARGS", "").strip()
        if extra:
            cmd.extend(shlex.split(extra))
        paths = os.environ.get("FUCKMARK_PATHS", "").strip()
        cmd.extend(shlex.split(paths) if paths else ["."])
        print("Running:", " ".join(shlex.quote(part) for part in cmd), flush=True)
        raise SystemExit(subprocess.call(cmd))
        PY
